syntax = "proto3";
package basic;

// [DART-SIGNAL]
message StreamEncodeInput { 
    bytes data = 1;
    int32 mtu = 2;
    uint32 repair_packets_per_block = 3;
}

// [RUST-SIGNAL]
message StreamEncodeOutput { 
    bytes result = 1;
    bool is_complete = 2;
}

// [DART-SIGNAL]
message DecodeChunkInput { 
    bytes data = 1;
    int32 mtu = 2;
    int32 transfer_length = 3;
    bool reset = 4;
}

// [RUST-SIGNAL]
message DecodeOutput { 
    bytes result = 1;
    int32 time = 2;
    int32 chunk_len = 3;
}
