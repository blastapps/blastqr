name: blast_qr
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
# The major version is the protocol version (docs/protocol.md).
version: 3.0.7+8

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  intl: any
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  tuple: ^2.0.2
  meta: ^1.17.0
  flutter_zxing: ^3.1.0
  image_picker: ^1.1.2
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  open_file: ^4.0.0
  mime: ^2.0.0
  provider: ^6.1.2
  flutter_animate: ^4.5.2
  hugeicons: ^1.1.5
  flutter_native_splash: ^2.4.5
  shared_preferences: ^2.5.2
  receive_sharing_intent: ^1.9.0
  qr: ^3.0.2
  desktop_drop: ^0.8.4
  flutter_image_compress: ^2.5.1
  path: ^1.9.1
  archive: ^4.0.9
  camera: ^0.11.4
  camera_desktop: ^2.0.0
  wakelock_plus: ^1.5.2
  flutter_soloud: ^4.0.5
  record: ^6.2.0
  package_info_plus: ^9.0.1
  media_scanner: ^2.2.1
  raptorq_flutter: ^0.1.0
  blastqr_crypto:
    path: packages/blastqr_crypto
  share_plus: ^12.0.2
  url_launcher: ^6.3.3
  image: ^4.8.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Loads the host-built RaptorQ library in tests. Keep in sync with
  # raptorq_flutter's version.
  flutter_rust_bridge: 2.8.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  path_provider_platform_interface: ^2.1.2

flutter:
  generate: true
  uses-material-design: true
  shaders:
    - shaders/qr_twinkle.frag
  assets:
    - assets/download-qr.png 
    - fonts/Jersey25/OFL.txt
    - assets/licenses/raptorq.txt
    - assets/licenses/rustcrypto.txt
    - assets/licenses/subtle.txt
  fonts:
    - family: Jersey25
      fonts:
        - asset: fonts/Jersey25/Jersey25-Regular.ttf
