name: blast_qr
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.1+5

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  intl: any
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  tuple: ^2.0.2
  meta: ^1.17.0
  flutter_zxing: 2.2.1
  image_picker: ^1.1.2
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  open_file: ^3.5.10
  mime: ^2.0.0
  provider: ^6.1.2
  flutter_animate: ^4.5.2
  hugeicons: ^1.1.5
  flutter_native_splash: ^2.4.5
  shared_preferences: ^2.5.2
  share_handler: ^0.0.25
  qr: ^3.0.2
  super_drag_and_drop: ^0.9.1
  flutter_image_compress: ^2.4.0
  path: ^1.9.1
  camera: ^0.11.4
  wakelock_plus: ^1.5.2
  screen_brightness: ^2.1.8
  flutter_soloud: ^4.0.5
  raptorq_flutter:
    path: ../raptorq_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/bg_qr.webp 
    - assets/download-qr.png 
    - fonts/Jersey25/OFL.txt
    - assets/licenses/raptorq.txt
  fonts:
    - family: Jersey25
      fonts:
        - asset: fonts/Jersey25/Jersey25-Regular.ttf
