name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Preinstalled on GitHub's image and conflicts with libunwind-dev,
          # which libgstreamer1.0-dev needs.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # Ubuntu 22.04's clang 14 can't compile flutter_zxing's C++20 ranges code.
      - name: Install clang 18
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"

      # GitHub's runners have rustup; local act images don't.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pubspec version $version"
            exit 1
          fi

      - name: Build
        env:
          # The app only plays generated WAVs, so skip SoLoud's prebuilt
          # Ogg/Opus/FLAC libraries (x64-only).
          NO_XIPH_LIBS: 1
        run: |
          flutter --disable-analytics
          flutter pub get
          flutter build linux --release

      # Release notes come from the tag message (git tag -a v1.2.3 -m "...").
      - name: Add release to metainfo
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          notes=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # checkout leaves annotated tags as lightweight ones.
            git fetch --force --depth=1 origin \
              "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
              notes=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME")
            fi
          fi
          VERSION="$version" NOTES="$notes" python3 - \
            linux/packaging/dev.blastapps.blastqr.metainfo.xml <<'EOF'
          import datetime, os, sys
          from xml.sax.saxutils import escape

          path = sys.argv[1]
          paragraphs = [
              " ".join(p.split())
              for p in os.environ["NOTES"].split("\n\n")
              if p.strip()
          ]
          entry = f'    <release version="{os.environ["VERSION"]}" date="{datetime.date.today()}"'
          if paragraphs:
              body = "".join(f"        <p>{escape(p)}</p>\n" for p in paragraphs)
              entry += f">\n      <description>\n{body}      </description>\n    </release>\n"
          else:
              entry += "/>\n"
          xml = open(path).read()
          xml = xml.replace("  <releases>\n", "  <releases>\n" + entry, 1)
          open(path, "w").write(xml)
          EOF
          cat linux/packaging/dev.blastapps.blastqr.metainfo.xml

      - name: Package
        run: |
          bundle=build/linux/${{ matrix.arch }}/release/bundle
          id=dev.blastapps.blastqr
          install -Dm644 linux/packaging/$id.desktop -t $bundle/share/applications
          install -Dm644 linux/packaging/$id.metainfo.xml -t $bundle/share/metainfo
          install -Dm644 linux/packaging/$id.png -t $bundle/share/icons/hicolor/512x512/apps
          name="blastqr-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          tar -czf "$name.tar.gz" -C build/linux/${{ matrix.arch }}/release \
            --transform "s/^bundle/blastqr/" bundle
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}

  flatpak:
    needs: build
    strategy:
      matrix:
        include:
          - arch: x64
            flatpak-arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            flatpak-arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: tarball

      - name: Use the tarball as the manifest's source
        run: mv tarball/*.tar.gz linux/packaging/blastqr-linux.tar.gz

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: linux/packaging/dev.blastapps.blastqr.yml
          bundle: blastqr-${{ github.ref_name }}-linux-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.flatpak-arch }}
          artifact-name: flatpak-${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}

  cli:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: cli
    env:
      # No Visual C++ runtime needed on Windows.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches CLI version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match CLI version $version"
            exit 1
          fi

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          name="blastqr-cli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir dist
          cp ../LICENSE README.md dist/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/blastqr.exe dist/
            (cd dist && 7z a "../$name.zip" .)
            echo "ARCHIVE=cli/$name.zip" >> "$GITHUB_ENV"
          else
            cp target/${{ matrix.target }}/release/blastqr dist/
            tar -czf "$name.tar.gz" -C dist blastqr LICENSE README.md
            echo "ARCHIVE=cli/$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pubspec version $version"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Write signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build
        run: |
          flutter --disable-analytics
          flutter pub get
          flutter build appbundle --release
          flutter build apk --release
          apk="blastqr-${GITHUB_REF_NAME}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ env.APK }}

      # Play only accepts draft releases until the app has passed its first
      # review; switch status to completed after that.
      - name: Upload to Google Play
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.blastapps.blastqr
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pubspec version $version"
            exit 1
          fi

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          # The app only plays generated WAVs, so skip SoLoud's prebuilt
          # Ogg/Opus/FLAC libraries.
          NO_XIPH_LIBS: 1
        run: |
          flutter --disable-analytics
          flutter pub get
          flutter build windows --release

      - name: Package
        env:
          # Keeps Git Bash from turning ISCC's /D options into paths.
          MSYS_NO_PATHCONV: 1
        run: |
          bundle=build/windows/x64/runner/Release
          # Flutter doesn't bundle the Visual C++ runtime; ship it next to the
          # exe so the app runs on PCs without it installed.
          cp /c/Windows/System32/{msvcp140,vcruntime140,vcruntime140_1}.dll $bundle/
          name="blastqr-${GITHUB_REF_NAME}-windows-x64"
          (cd $bundle && 7z a "$GITHUB_WORKSPACE/$name.zip" . >/dev/null)

          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$iscc" ] || choco install innosetup -y --no-progress >/dev/null
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          "$iscc" /Q "/DAppVersion=$version" "/DBuildDir=$(cygpath -w "$PWD/$bundle")" \
            "/DOutputName=$name-setup" "/O$(cygpath -w "$GITHUB_WORKSPACE")" \
            windows/packaging/blastqr.iss
          ls -l "$name.zip" "$name-setup.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            blastqr-*-windows-x64.zip
            blastqr-*-windows-x64-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, flatpak, cli, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
            *.flatpak
            *.apk
            *.exe
          draft: true
