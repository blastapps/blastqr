name: Mirror release to Codeberg

# Copies the published GitHub release to Codeberg, with its downloads
# added as links to the GitHub files.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, like v3.0.1
        required: true

env:
  CODEBERG_API: https://codeberg.org/api/v1/repos/cukha/blastqr
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Codeberg release
        env:
          GH_TOKEN: ${{ github.token }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "CODEBERG_TOKEN secret is not set" >&2
            exit 1
          fi

          # api METHOD PATH [curl args...]: prints the response body, fails with it on HTTP errors.
          api() {
            local method=$1 path=$2 status
            shift 2
            status=$(curl -s -o resp.json -w '%{http_code}' -X "$method" \
              -H "Authorization: token $CODEBERG_TOKEN" "$@" "$CODEBERG_API$path")
            if [ "$status" -ge 400 ]; then
              echo "$method $path failed with HTTP $status: $(cat resp.json)" >&2
              return 1
            fi
            cat resp.json
          }

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json name,body,isPrerelease,assets > gh.json
          jq '{tag_name: env.TAG, name: .name, body: .body, prerelease: .isPrerelease, draft: false}' \
            gh.json > release.json

          json=(-H 'Content-Type: application/json' -d @release.json)
          if existing=$(api GET "/releases/tags/$TAG" 2>/dev/null); then
            id=$(jq -r .id <<< "$existing")
            api PATCH "/releases/$id" "${json[@]}" > /dev/null
          else
            id=$(api POST /releases "${json[@]}" | jq -r .id)
          fi
          echo "Codeberg release id: $id"

          api GET "/releases/$id/assets" | jq -r '.[].name' > have.txt
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          jq -r '.assets[].name' gh.json |
            while read -r name; do
              if grep -qxF "$name" have.txt; then
                echo "skip $name"
                continue
              fi
              api POST "/releases/$id/assets?name=$(jq -rn --arg n "$name" '$n|@uri')" \
                -F "external_url=$base/$name" > /dev/null
              echo "linked $name"
            done
