[package]
name = "blastqr"
version = "3.0.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fast_qr = "0.14"
flate2 = "1"
png = "0.18"
rand_core = { version = "0.6", features = ["getrandom"] }
raptorq = "2.0.1"
rpassword = "7"
zeroize = "1"
zip = { version = "9.1.0", default-features = false }

[dev-dependencies]
rqrr = "0.11"
