[package]
name = "blastqr"
version = "3.0.3"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
base64 = "0.22"
blastqr_envelope = { path = "../packages/blastqr_envelope" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
fast_qr = "0.14"
flate2 = "1"
png = "0.18"
rand_core = { version = "0.6", features = ["getrandom"] }
raptorq = "2.0.1"
rpassword = "7"
zip = { version = "9.1.0", default-features = false }

[dev-dependencies]
rqrr = "0.11"

[profile.release]
strip = true
