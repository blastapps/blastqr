name: blastqr_video
description: >
  Video re-encoding for BlastQR with the platform's encoder: AVFoundation on
  iOS and macOS, Media3 Transformer on Android, ffmpeg on Linux.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.blastapps.blastqr_video
        pluginClass: BlastqrVideoPlugin
      ios:
        pluginClass: BlastqrVideoPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: BlastqrVideoPlugin
        sharedDarwinSource: true
