name: blastqr_crypto
description: >
  Password-based encryption (Argon2id + ChaCha20-Poly1305) for BlastQR
  transfers. Backed by Rust via flutter_rust_bridge.
version: 0.1.0
homepage:

environment:
  sdk: ^3.11.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.8.0
  code_assets: ^1.0.0
  hooks: ^1.0.2
  native_toolchain_rust: 1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
